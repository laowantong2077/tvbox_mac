[package]
name = "sxk_core"
version = "1.0.0"
edition = "2021"
description = "随心看 本地后端（Rust 版）"

[lib]
name = "sxk_core"
path = "src/lib.rs"

[[bin]]
name = "sxk-server"
path = "src/bin/sxk-server.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "signal", "io-util"] }
axum = { version = "0.8", features = ["json", "query"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "deflate", "brotli", "stream", "socks", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
once_cell = "1"
parking_lot = "0.12"
regex = "1"
url = "2"
encoding_rs = "0.8"
bytes = "1"
futures-util = "0.3"
rust-embed = { version = "8", features = ["mime-guess", "debug-embed"] }
mime_guess = "2"
if-addrs = "0.13"
percent-encoding = "2"
urlencoding = "2"
flate2 = "1"
brotli-decompressor = "6"
